<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AI Agent Office · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen night office. 3D floor fills the screen; roster panel docks right on desktop, bottom sheet on phone. */
:root{
  --bg:#0e1116; --panel:#161b22; --panel-2:#1d2430; --line:#2a3342;
  --fg:#e7ecf3; --muted:#8d99ab; --accent:#7cc4ff;
  --working:#ffb547; --done:#4fd18b; --failed:#ff5f6d; --idle:#6f7d91;
  --display:"Unbounded","Archivo",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
/* clicking or dragging the 3D view must not select text; the roster stays selectable */
body{-webkit-user-select:none;user-select:none}
#detail,#list .l,#toast{-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:pan-y;outline:none}
#explore{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;font:600 13px/1 var(--body);color:#0e1116;background:var(--accent);border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
@media (max-width:760px){#explore{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
@media (max-height:640px),(max-width:480px){#nextup,#motion{display:none} header.top h1{font-size:15px} header.top p{font-size:11px}}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tag .bub{font:500 11px/1.3 var(--body);background:rgba(22,27,34,.92);border:1px solid var(--line);color:var(--fg);padding:3px 8px;border-radius:999px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tag .nm{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:3px 7px;border-radius:4px;color:#0e1116}
.desktag{position:absolute;transform:translate(-50%,-50%);font:500 10.5px/1 var(--mono);padding:3px 6px;border-radius:4px;background:rgba(14,17,22,.78);border:1px solid;white-space:nowrap;pointer-events:auto;cursor:pointer;opacity:.8}
.desktag.on{opacity:1;background:rgba(14,17,22,.95)}
.tag[data-state="working"] .bub{border-color:var(--working)}
.tag[data-state="failed"] .bub{border-color:var(--failed)}
header.top{position:fixed;top:0;left:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
header.top h1{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.01em}
header.top p{margin:0;font:400 12px/1.4 var(--mono);color:var(--muted)}
#motion{pointer-events:auto;align-self:flex-start;margin-top:6px;font:500 12px/1 var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
#motion[aria-pressed="false"]{color:var(--muted)}
#motion:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#roster{position:fixed;top:0;right:0;bottom:0;width:330px;background:rgba(22,27,34,.94);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-right:env(safe-area-inset-right,0px)}
#roster .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
#roster .head h2{margin:0;font:500 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.counts{display:flex;gap:10px;font:500 12px/1 var(--mono)}
.counts span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
#list{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1;min-height:0}
#list li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
#list li:hover,#list li.sel{background:var(--panel-2)}
#list li.sel{border-left-color:var(--accent)}
#list li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#list .sw{width:12px;height:12px;border-radius:3px;margin-top:3px}
#list .t{font:600 14px/1.25 var(--body);min-width:0}
#list .r{font:400 12px/1 var(--mono);color:var(--muted);margin-left:4px}
#list .l{font:400 12px/1.4 var(--body);color:var(--muted);margin-top:2px;min-width:0;overflow-wrap:anywhere}
.pill{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.working{color:var(--working)}.pill.done{color:var(--done)}.pill.failed{color:var(--failed)}.pill.idle{color:var(--idle)}
#detail{border-top:1px solid var(--line);padding:12px 16px 4px;display:flex;flex-direction:column;gap:6px}
#detail h3{margin:0;font:700 15px/1.2 var(--display)}
#detail .job{font:400 12px/1.3 var(--mono);color:var(--muted)}
#detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:4px 0 0;font-size:13px}
#detail dt{color:var(--muted)}#detail dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#empty{margin:10px 16px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--muted);line-height:1.5}
footer.credits{padding:8px 16px 0;font:400 11px/1.4 var(--body);color:var(--muted)}
footer.credits a{color:var(--muted)}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:500 13px/1 var(--mono);color:var(--muted);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px}
#loading[hidden]{display:none}
#loading .bar{display:block;width:220px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#loading .bar i{display:block;height:100%;background:var(--accent)}
#nextup{font:500 12px/1.4 var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:4px;max-width:300px}
#nextup b{color:var(--working);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{font:500 12px/1 var(--mono);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-disabled="true"]{color:var(--muted);cursor:default}
.req{font:400 12px/1.4 var(--body);color:var(--muted)}
details.rep{margin-top:6px;font-size:12.5px;line-height:1.5}
details.rep summary{cursor:pointer;color:var(--accent);font:500 12px/1.4 var(--mono)}
details.rep pre{white-space:pre-wrap;font:400 12px/1.5 var(--body);margin:6px 0 0;max-height:180px;overflow:auto;background:var(--panel-2);border-radius:6px;padding:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:400 13px/1.45 var(--body);max-width:min(460px,calc(100% - 32px));z-index:20;display:flex;gap:12px;align-items:flex-start}
#toast button{background:none;border:0;color:var(--muted);font:500 16px/1 var(--body);cursor:pointer;padding:0 2px}
#sheet{display:inline-block;padding:5px 9px}
/* desktop: the panel minimizes to a thin strip at the right edge */
@media (min-width:761px){
  #roster{transition:transform .25s ease}
  #roster.collapsed{transform:translateX(calc(100% - 46px))}
  #roster.collapsed .head{justify-content:flex-start;padding-left:6px;border-bottom:0}
  #roster.collapsed .head h2,#roster.collapsed .counts{display:none}
  #roster.collapsed #list,#roster.collapsed #detail,#roster.collapsed #empty,#roster.collapsed footer{visibility:hidden}
  #roster.collapsed{border-left:2px solid var(--accent)}
  #roster.collapsed #sheet{font-size:18px;padding:9px 11px;background:var(--accent);color:#0e1116;border-color:var(--accent);font-weight:700}
}
#toast[hidden]{display:none}
@media (min-width:761px){ #toast{left:calc(50% - 165px)} }
@media (max-width:760px){
  #roster{top:auto;left:0;width:auto;height:46%;border-left:0;border-top:1px solid var(--line);padding-top:10px;padding-left:env(safe-area-inset-left,0px);transition:height .25s}
  #roster.collapsed{height:calc(52px + env(safe-area-inset-bottom,0px))}
  #roster.collapsed #list,#roster.collapsed #detail,#roster.collapsed #empty,#roster.collapsed footer{display:none}
  #sheet{display:inline-block}
  header.top h1{font-size:17px}
  #nextup{max-width:calc(100vw - 32px)}
  #toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<canvas id="stage" aria-label="3D office with one robot per AI agent"></canvas>
<div id="tags" aria-hidden="true"></div>
<header class="top">
  <h1>AI Agent Office</h1>
  <p id="clock">Live demo</p>
  <button id="motion" type="button" aria-pressed="true">Motion on</button>
  <div id="nextup" aria-live="polite"></div>
</header>
<aside id="roster" aria-label="Agents">
  <div class="head">
    <h2>Agents</h2>
    <div class="counts" id="counts"></div>
    <button id="sheet" class="btn" type="button" aria-expanded="false">Show</button>
  </div>
  <div id="empty" hidden></div>
  <ul id="list"></ul>
  <section id="detail" aria-live="polite"></section>
  <footer class="credits">Models: <a href="https://sketchfab.com/3d-models/isometric-office-d31464eed8044190911b221648aca432">Isometric office</a> by Companion_Cube · <a href="https://sketchfab.com/3d-models/cute-robots-low-poly-rigged-animated-c9938d49af2d4bf7abe40e366d37a5d0">Cute Robots</a> by m1ch3lang3lo · <a href="https://sketchfab.com/3d-models/animated-humanoid-robot-8993602ca91f4c499e690e5dae19f978">Animated humanoid robot</a> by pinguinoconpulgares · <a href="https://sketchfab.com/3d-models/nimbus-characterrig-5ce9a8c9cbbe498695542c4565ad356b">Nimbus</a> by Dudzy (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>)</footer>
</aside>
<div id="loading">Loading the office…</div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
<script>
const AGENTS = [
  {id:"lead", routine:null, sched:"every10",        name:"Lead", role:"Coordinator", desc:"Coordinates the team and the run queue",          job:"Demo agent",              color:"#7cc4ff", next:"every 10 min, Mon–Fri 7 AM–9 PM"},
  {id:"screener", routine:null, sched:[[1,2,3,4,5],12,0],   name:"Screener", role:"Applications", desc:"Screens new job applications against the role criteria",     job:"Demo agent",               color:"#ffb547", next:"Mon–Fri 12:00 PM"},
  {id:"followup", routine:null, sched:[[1,2,3,4,5],13,30],   name:"Follow-up", role:"Pipeline", desc:"Finds stuck candidates and follow-ups that are due",    job:"Demo agent",                      color:"#c792ea", next:"Mon–Fri 1:30 PM"},
  {id:"inbox", routine:null, sched:[[1,2,3,4,5],18,0],      name:"Inbox", role:"Email", desc:"Sorts the recruiting inbox and answers routine mails",        job:"Demo agent",            color:"#4fd18b", next:"Mon–Fri 6:00 PM"},
  {id:"kpi", routine:null, sched:[[1],8,0],        name:"Reports", role:"Weekly KPIs", desc:"Builds the weekly recruiting report",          job:"Demo agent",                    color:"#ff8a65", next:"Mon 8:00 AM"},
  {id:"parity", routine:null, sched:[[1,2,3,4,5],16,0],     name:"Job sync", role:"Career pages", desc:"Checks job ads match across every career page",       job:"Demo agent",                   color:"#80deea", next:"Mon–Fri 4:00 PM"},
  {id:"trigger", routine:null, sched:[[1],7,30],    name:"Automations", role:"Health check", desc:"Checks the ATS automations fired",job:"Demo agent",                 color:"#f06292", next:"Mon 7:30 AM"},
  {id:"spotcheck", routine:null, sched:[[2],10,0],  name:"Quality", role:"Review", desc:"Re-checks a sample of screenings for quality",   job:"Demo agent",                    color:"#aed581", next:"Tue 10:00 AM"},
  {id:"slack", routine:null, sched:"hourly",      name:"Messages", role:"Chat watch", desc:"Watches chat for replies to open questions",  job:"Demo agent",                   color:"#b39ddb", next:"hourly 3 PM–12 AM, Mon–Fri"},
  {id:"video", routine:null, sched:[[1,5],16,0],      name:"Reminders", role:"Candidates", desc:"Reminds candidates who still owe a video",  job:"Demo agent",color:"#ffd54f", next:"Mon 4:00 PM · Fri 4:00 PM"},
  {id:"dashboard", routine:null, sched:[[1,2,3,4,5],19,0],  name:"Dashboard", role:"Team board", desc:"Refreshes the team dashboard",    job:"Demo agent",             color:"#90a4ae", next:"Mon–Fri 7:00 PM"}
];
const STATE_LABEL = {working:"Working", done:"Done", failed:"Failed", idle:"Idle"};
const status = {};
AGENTS.forEach(a => status[a.id] = {state:"idle", line:"", lastRun:null, next:a.next});
let selected = "lead", bubbleFor = null; /* bubble text only for the robot you clicked */

const $ = s => document.querySelector(s);
function esc(t){return String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtPH(iso){
  if(!iso) return "–";
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  return d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function tick(){ $("#clock").textContent = new Date().toLocaleString("en-US",{weekday:"long",hour:"numeric",minute:"2-digit"}) + " · demo with example activity"; }
tick(); setInterval(tick, 30000);

/* PH clock maths: next scheduled run of an agent (weekday 1=Mon … 5=Fri) */
const PH_OFFSET = -new Date().getTimezoneOffset();
function phParts(d){ const x = new Date(d.getTime() + PH_OFFSET*60000); return {y:x.getUTCFullYear(), mo:x.getUTCMonth(), d:x.getUTCDate(), wd:x.getUTCDay(), h:x.getUTCHours(), mi:x.getUTCMinutes()}; }
function phDate(y,mo,d,h,mi){ return new Date(Date.UTC(y,mo,d,h,mi) - PH_OFFSET*60000); }
function nextRun(a, from = new Date()){
  const sc = a.sched; let best = null;
  for(let add=0; add<8; add++){
    const base = phParts(new Date(from.getTime() + add*86400000));
    const slots = [];
    if (sc === "every10") { if ([1,2,3,4,5].includes(base.wd)) for(let h=7;h<=20;h++) for(let m=0;m<60;m+=10) slots.push([h,m]); }
    else if (sc === "hourly") { if ([1,2,3,4,5].includes(base.wd)) { slots.push([0,0]); for(let h=15;h<=23;h++) slots.push([h,0]); } }
    else if (Array.isArray(sc) && sc[0].includes(base.wd)) slots.push([sc[1], sc[2]]);
    for (const [h,m] of slots){ const t = phDate(base.y, base.mo, base.d, h, m); if (t > from && (!best || t < best)) best = t; }
    if (best) break;
  }
  return best;
}
const fmtTime = d => d ? d.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"}) : "–";
function fmtIn(d){ if(!d) return ""; const m = Math.round((d - Date.now())/60000); if (m < 60) return `in ${m} min`; const h = Math.floor(m/60); return h < 24 ? `in ${h} h ${m%60} min` : `in ${Math.floor(h/24)} d`; }
function upcoming(n){ return AGENTS.map(a=>({a, t:nextRun(a)})).filter(x=>x.t && x.a.id!=="lead").sort((x,y)=>x.t-y.t).slice(0,n); }
function renderNext(){
  const u = upcoming(1)[0];
  $("#nextup").innerHTML = u ? `Next up: <b>${esc(u.a.name)}</b> · ${fmtTime(u.t)} (${fmtIn(u.t)})` : "";
}
let requests = [], dbRef = null, lastSeen = null;
const reqFor = a => requests.filter(r=>r.routine_id===a.routine).sort((x,y)=>String(y.requested_at).localeCompare(String(x.requested_at)))[0];
async function runNow(a){
  const open = reqFor(a);
  if (!dbRef || !a.routine || (open && ["queued","running"].includes(open.status))) return;
  const ph = new Date(Date.now() + PH_OFFSET*60000).toISOString().replace("Z","+08:00");
  try { await dbRef.collection("requests").add({routine_id:a.routine, agent:a.id, status:"queued", requested_at:ph, source:"demo"}); }
  catch(e){ showToast("Couldn't queue the run. Only you (the owner) can start runs from here."); }
}

function renderList(){
  const c = {working:0,done:0,failed:0,idle:0};
  AGENTS.forEach(a => c[status[a.id].state] = (c[status[a.id].state]||0)+1);
  $("#counts").innerHTML = ["working","done","failed"].map(k=>`<span title="${STATE_LABEL[k]}"><i class="dot" style="background:var(--${k})"></i>${c[k]}</span>`).join("");
  $("#list").innerHTML = AGENTS.map(a=>{
    const s = status[a.id];
    return `<li tabindex="0" data-id="${a.id}" class="${a.id===selected?"sel":""}">
      <span class="sw" style="background:${a.color}"></span>
      <div style="min-width:0"><div class="t">${esc(a.name)} <span class="r">${esc(a.role)}</span></div><div class="l">${esc(a.desc)}</div></div>
      <span class="pill ${s.state}">${STATE_LABEL[s.state]}</span></li>`;
  }).join("");
  const a = AGENTS.find(x=>x.id===selected), s = status[selected];
  $("#detail").innerHTML = `<h3>${esc(a.name)} · ${esc(a.role)}</h3><div class="job">${esc(a.job)}</div>
    <dl><dt>Status</dt><dd><span class="pill ${s.state}">${STATE_LABEL[s.state]}</span></dd>
    <dt>Result</dt><dd>${esc(s.line || "–")}</dd>
    <dt>Last run</dt><dd>${fmtPH(s.lastRun)}</dd>
    <dt>Next run</dt><dd>${fmtTime(nextRun(a))} <span class="req">${fmtIn(nextRun(a))}</span></dd>
    ${s.pile ? `<dt>Open work</dt><dd>${esc(s.pile)} <span class="req">(the paper pile on its desk)</span></dd>` : ""}</dl>
    ${s.report ? `<details class="rep"><summary>Last report</summary><pre>${esc(s.report)}</pre></details>` : ""}
    ${detailActions(a)}`;
}
function detailActions(a){ return `<div class="req">Demo: example activity, no real data.</div>`;
  if (!a.routine) return a.id==="video" ? `<div class="req">Runs on schedule only: it sends emails to candidates.</div>` : "";
  const r = reqFor(a), busy = r && ["queued","running"].includes(r.status);
  const label = {queued:"Queued, starts within 10 min", running:"Running now", done:"Last Run now: done", failed:"Last Run now: failed", expired:"Last Run now: expired"}[r?.status] || "";
  return `<div class="acts"><button class="btn" type="button" data-run="${a.id}" aria-disabled="${busy||!dbRef}">${busy ? "Run requested" : "Run now"}</button></div>
    ${label ? `<div class="req">${esc(label)}${r.summary ? " · " + esc(r.summary) : ""}</div>` : ""}`;
}
$("#detail").addEventListener("click", e=>{ const b = e.target.closest("[data-run]"); if (b && b.getAttribute("aria-disabled")!=="true") runNow(AGENTS.find(x=>x.id===b.dataset.run)); });
$("#list").addEventListener("click", e=>{const li=e.target.closest("li"); if(li) select(li.dataset.id)});
$("#list").addEventListener("keydown", e=>{if((e.key==="Enter"||e.key===" ")){const li=e.target.closest("li"); if(li){e.preventDefault();select(li.dataset.id)}}});
function select(id){ if (roster.classList.contains("collapsed")) { roster.classList.remove("collapsed"); syncSheet(); } selected=id; bubbleFor = (bubbleFor===id) ? null : id; renderList(); updateTags(true); }
renderList(); renderNext(); setInterval(()=>{ renderNext(); renderList(); }, 30000);

function showToast(html){ const t = $("#toast"); t.innerHTML = `<div>${html}</div><button type="button" aria-label="Close">×</button>`; t.hidden = false; t.querySelector("button").onclick = ()=> t.hidden = true; }
const sheetBtn = $("#sheet"), roster = $("#roster");
if (innerWidth <= 760) roster.classList.add("collapsed");
else { try { if (localStorage.getItem("agentOfficePanel") === "min") roster.classList.add("collapsed"); } catch(e) {} }
function syncSheet(){ sheetLabel(); resize(); }
function sheetLabel(){ const c = roster.classList.contains("collapsed"), wide = innerWidth > 760;
  sheetBtn.textContent = wide ? (c ? "‹" : "Hide ›") : (c ? "Show" : "Hide"); sheetBtn.title = c ? "Show the agents panel" : "Minimize the agents panel";
  try { if (wide) localStorage.setItem("agentOfficePanel", c ? "min" : "open"); } catch(e) {} sheetBtn.setAttribute("aria-expanded", String(!c)); }
sheetBtn.addEventListener("click", ()=>{ roster.classList.toggle("collapsed"); syncSheet(); });
sheetLabel();

/* ---------- 3D ---------- */
const canvas = $("#stage");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const SIZES = {"office.glb":2399684, "robots.glb":1798572, "r1.glb":1254388, "r4.glb":466748};
const got = {};
function showProgress(){
  const total = Object.values(SIZES).reduce((a,b)=>a+b,0), have = Object.values(got).reduce((a,b)=>a+b,0);
  const pct = Math.min(100, Math.round(have/total*100));

}
async function load(url){
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + " " + res.status);
  let buf;
  if (res.body && res.body.getReader) {
    const reader = res.body.getReader(), chunks = []; let n = 0;
    for(;;){ const {done, value} = await reader.read(); if (done) break; chunks.push(value); n += value.length; got[url] = n; showProgress(); }
    buf = new Uint8Array(n); let o = 0; for (const c of chunks){ buf.set(c, o); o += c.length; }
  } else { buf = new Uint8Array(await res.arrayBuffer()); got[url] = buf.length; showProgress(); }
  return new Promise((res2,rej)=>loader.parse(buf.buffer, "", res2, rej));
}
showProgress();
const mixers = [], bots = {};

Promise.all([MeshoptDecoder.ready, load("office.glb"), load("robots.glb"), load("r1.glb"), load("r4.glb")]).then(([_, office, robots, r1, r4])=>{

  const box = new THREE.Box3().setFromObject(room), size = box.getSize(new THREE.Vector3());
  box.getCenter(roomCenter);
  const span = Math.max(size.x, size.z);

  /* doors: swing on a hinge at one edge; they are left out of the floor grid so robots can path through */
  const doorNodes = []; room.traverse(o=>{ if(/^Door\d/.test(o.name)) doorNodes.push(o); });

  doorNodes.forEach(d=>{
    const db = new THREE.Box3().setFromObject(d), ds = db.getSize(new THREE.Vector3()), dc = db.getCenter(new THREE.Vector3());

  });

  const cx = i => box.min.x + (i+.5)*CELL, cz = k => box.min.z + (k+.5)*CELL, idx = (i,k) => k*nx+i;

  addSpots(/^water_despencer/, "Getting water"); addSpots(/^printer/, "Checking the printer");

  {

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map: board.tex, toneMapped:false}));

function think(t){

  for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++){
    const A = bots[ids[i]], B = bots[ids[j]];
    if (!A.path.length || !B.path.length || A.mode!=="stroll" || B.mode!=="stroll") continue;
    if ((A.greetCool||0) > t || (B.greetCool||0) > t) continue;
    if (A.bot.position.distanceTo(B.bot.position) < ctx.span*0.06){
      A.pauseUntil = B.pauseUntil = t + 1.6; A.greetCool = B.greetCool = t + 25; A.greet = B.bot.position; B.greet = A.bot.position;

  if(!meeting && t > nextMeeting && dayPhase === "night") nextMeeting = t + 60;
  if(!meeting && t > nextMeeting){
    const freeIds = Object.keys(bots).filter(id => !["working","failed"].includes(status[id].state) && ["desk","strollWait"].includes(bots[id].mode));
    if(freeIds.length >= 3){
      freeIds.sort(()=>Math.random()-.5);
      const ids = freeIds.slice(0, 3 + ((Math.random()*3)|0));
      if(!ids.includes("lead") && freeIds.includes("lead")) ids[0] = "lead";
      meeting = {ids, topic: TOPICS[(Math.random()*TOPICS.length)|0], ends: t + 40};

}

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _pq = new THREE.Quaternion(), _wq = new THREE.Quaternion();

    for(const id in bots){ const b = bots[id]; b.ring.material.opacity = status[id].state==="failed" ? .45 + .45*Math.abs(Math.sin(t*3)) : .9; }
  }
  controls.update(); renderer.render(scene, camera); updateTags();
})();

const WORK = {
  screener:["Screening 14 new applications","14 checked · 9 comments posted · 5 drafts"],

  inbox:["Sorting the recruiting inbox","11 mails sorted · 3 replies sent"],

};
TOPICS = ["Pipeline check-in","Screening sync","Weekly KPI huddle","Inbox stand-up","Candidate review","Sprint planning"];

  {label:"Mails sorted", value:63},{label:"Replies sent", value:27},{label:"Hours saved", value:"18h"}]};
const ago = m => new Date(Date.now() - m*60000).toISOString();
AGENTS.forEach((a,i)=>{ const w = WORK[a.id]; status[a.id] = {state:"done", line:w[1], lastRun:ago(20+i*37), next:"", report:"", pile: [0,8,22,3,0,0,0,5,2,8,7][i], fresh:false}; });
renderList();
function startRun(){
  const free = AGENTS.filter(a => status[a.id].state !== "working");
  if (AGENTS.filter(a => status[a.id].state === "working").length >= 3 || !free.length) return;
  const a = free[(Math.random()*free.length)|0], w = WORK[a.id];
  status[a.id] = {...status[a.id], state:"working", line:w[0]}; applyState(a.id); renderList();
  setTimeout(()=>{
    const failed = Math.random() < 0.1;
    status[a.id] = {...status[a.id], state: failed ? "failed" : "done", line: failed ? "Login expired · needs a look" : w[1], lastRun: new Date().toISOString(), fresh: !failed};
    applyState(a.id); renderList();
    if (failed) setTimeout(()=>{ status[a.id] = {...status[a.id], state:"done", line:w[1]}; applyState(a.id); renderList(); }, 25000);
    else setTimeout(()=>{ status[a.id].fresh = false; }, 8000);
  }, 25000 + Math.random()*35000);
}
(function waitReady(){
  if (!ready) return setTimeout(waitReady, 500);
  for (const id in bots) setPile(id, status[id].pile);
  drawBoard();
  startRun(); setTimeout(startRun, 6000);
  setInterval(startRun, 14000);
})();
